# Pile complète : Sources -> Agent IA -> PostgreSQL -> Grafana -> MCP -> Chatbot Next.js
name: grc-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grc
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc -d grc"]
      interval: 5s
      retries: 20

  # Agent de veille : collecte immédiate puis toutes les heures (APScheduler)
  agent:
    build: ./agent
    environment:
      DATABASE_URL: postgresql://grc:${POSTGRES_PASSWORD:-grc}@postgres:5432/grc
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      COLLECT_INTERVAL_MINUTES: ${COLLECT_INTERVAL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grc-risques.json
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      retries: 30

  # Crée le compte de service Grafana "mcp-readonly" (rôle Viewer) et son jeton
  grafana-init:
    image: python:3.13-slim
    command: ["python", "/init/create_readonly_token.py"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GF_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      TOKEN_FILE: /secrets/grafana_mcp_token
    volumes:
      - ./grafana/init:/init:ro
      - mcp-secrets:/secrets
    depends_on:
      grafana:
        condition: service_healthy

  # Serveur MCP officiel Grafana, en lecture seule
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - mcp-grafana:8000,localhost:8000,127.0.0.1:8000
      - --disable-write                 # aucun outil de création/modification
      - --enabled-tools
      - search,datasource,dashboard,runpanelquery
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /secrets/grafana_mcp_token
      GRAFANA_USAGE_STATS: disabled
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:-change-me-mcp-token}
    volumes:
      - mcp-secrets:/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    restart: unless-stopped

  chatbot:
    build: ./chatbot
    environment:
      DATABASE_URL: postgresql://grc_reader:grc_reader@postgres:5432/grc
      MCP_GRAFANA_URL: http://mcp-grafana:8000/mcp
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:-change-me-mcp-token}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    ports:
      - "3001:3000"
    depends_on:
      - mcp-grafana
      - postgres

volumes:
  pgdata:
  grafana-data:
  mcp-secrets:
